# docker-compose.yml
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-server
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull a model on startup (blocking until complete)
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 2 && ollama pull llama3.2:3b && tail -f /dev/null"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    # GPU support: uncomment if NVIDIA GPU available
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build: .
    container_name: chatbot-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    depends_on:
      - ollama

volumes:
  ollama_data:
